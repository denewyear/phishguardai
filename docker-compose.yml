version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: phishguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: phishguard
      DB_USER: postgres
      DB_PASS: password
      DB_PORT: 5432
      JWT_SECRET: local-dev-secret-change-in-prod
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    environment:
      REACT_APP_API_URL: http://localhost:8000

volumes:
  pgdata:
